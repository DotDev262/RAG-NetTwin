[project]
name = "rag-nettwin"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "rich>=13.0.0",
    "chromadb>=1.4.1",
    "fastapi>=0.128.1",
    "langchain-core>=1.0.0",
    "langchain-text-splitters>=1.0.0",
    "langchain-groq>=1.1.2",
    "langchain-google-genai>=1.0.0",
    "napalm>=5.1.0",
    "numpy>=2.2.6",
    "pybatfish>=2025.7.7.2423",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "tqdm>=4.67.3",
    "uvicorn>=0.40.0",
    "ciscoconfparse>=1.9.0",
    "opendataloader-pdf>=2.2.1",
    "rank_bm25>=0.2.2",
    "dspy-ai>=2.5.0",
    "scipy>=1.15.0",
    "torch>=2.0.0",
    "sentence-transformers>=3.1.0",
    "hf-xet>=1.4.3",
]

[project.optional-dependencies]
paper = [
    "matplotlib>=3.10.8",
    "pandas>=2.3.3",
    "seaborn>=0.13.2",
]
local-llm = [
    "langchain-community>=0.4.1",
    "langchain-ollama>=1.1.0",
    "llama-cpp-python>=0.3.16",
]

[dependency-groups]
dev = [
    "graphifyy>=0.7.10",
    "mypy>=1.15.0",
    "pandas-stubs>=2.2.3.241126",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.9.0",
    "scipy-stubs>=1.15.0.2",
    "types-networkx>=3.6.1.20260518",
    "types-requests>=2.32.0.20241016",
    "types-tqdm>=4.67.3.20260518",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning:telnetlib",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]


