name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"
    
    - name: Install Just
      uses: extractions/setup-just@v2
    
    - name: Set up Python
      run: uv python install 3.11
    
    - name: Start Batfish
      run: |
        docker run -d --name batfish -p 9997:9997 -p 9996:9996 batfish/allinone
        # Wait for Batfish to be ready
        for i in {1..30}; do
          if curl -s http://localhost:9996/v1/test/ping > /dev/null; then
            echo "Batfish is ready!"
            break
          fi
          echo "Waiting for Batfish..."
          sleep 2
        done
    
    - name: Install dependencies
      run: uv sync --frozen
    
    - name: Run Linting
      run: just lint
    
    - name: Run Tests
      run: just test
