name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"
    
    - name: Set up Python
      run: uv python install 3.11
    
    - name: Start Batfish
      run: |
        docker run -d --name batfish -p 9997:9997 -p 9996:9996 batfish/allinone
        # Wait for Batfish to be ready
        for i in {1..30}; do
          if curl -s http://localhost:9996/v1/test/ping > /dev/null; then
            echo "Batfish is ready!"
            break
          fi
          echo "Waiting for Batfish..."
          sleep 2
        done
    
    - name: Install dependencies
      run: uv sync --frozen
    
    - name: Run Linting
      run: |
        set -euo pipefail
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          git fetch origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}" --depth=1
          mapfile -t changed_python_files < <(git diff --name-only --diff-filter=ACMRT "origin/${{ github.base_ref }}..HEAD" -- '*.py')
        else
          mapfile -t changed_python_files < <(git diff --name-only --diff-filter=ACMRT "${{ github.event.before }}..${{ github.sha }}" -- '*.py' || true)
        fi
        if [ "${#changed_python_files[@]}" -eq 0 ]; then
          echo "No changed Python files to lint."
          exit 0
        fi
        uv run ruff check "${changed_python_files[@]}"
    
    - name: Run Tests
      run: uv run pytest
